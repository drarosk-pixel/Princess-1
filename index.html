<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-soft"></div>

<!-- background song: apna gaana song.mp3 naam se isi folder me rakhna -->
<audio id="aud" loop><source src="song.mp3" type="audio/mpeg"></audio>

<!-- page dots -->
<div class="dots">
  <a class="on"></a><a></a><a></a><a></a>
</div>

<div class="page">
  <section class="cover">
    <div class="crown">👑</div>
    <div class="badge">happy princess day</div>

    <div class="photo-heart">
      <img src="images/dp.jpg" alt="" onerror="this.outerHTML='<div class=\'ph\'>👸</div>'">
    </div>

    <h1>for my <em>princess</em></h1>
    <p class="sub">ek chhoti si duniya, jo sirf tumhare liye banayi hai 🌸</p>

    <div style="margin-top:2.4rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
      <a class="btn" href="story.html" onclick="event.preventDefault();startMusicAndGo('story.html')">Enter 💕</a>
    </div>
  </section>
</div>

<div id="mbar"><div class="disc"></div><div class="sname">tap to play 🎵</div></div>

<script src="app.js"></script>
</body>
</html>
